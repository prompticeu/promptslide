name: CI

on:
  pull_request:
    branches: [main]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run test

      - run: bun run build
        working-directory: packages/cli

      - run: node benchmarks/pptx/browser-build.mjs

      - name: Install local browser test runtime
        run: |
          node packages/cli/node_modules/playwright/cli.js install chromium --with-deps
          sudo apt-get install -y fonts-dejavu-core

      - run: node benchmarks/pptx/browser-qualification.mjs
